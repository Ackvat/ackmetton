[build-system]
requires = ["setuptools>=61.0.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ackmetton"
dynamic = ["version"]
description = "A base library for making use of classes that has commonly used and modular functions and variables."
readme = "README.md"
requires-python = ">=3.14"
# dependencies = [] # pip packages goes here.

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*.__pycache__"]

[tool.setuptools_scm]
root = "."
